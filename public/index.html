<style>
:root{--bg:#0a1228;--panel:#111d3d;--ink:#e6efff;--mute:#8fa6d1;--line:#223562;--flag:#2de2e6;--good:#5eead4;--bad:#ff9db0;--sky:#6fb4ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 420px at 88% -120px,#1f4aa0 0,transparent 70%),radial-gradient(700px 400px at -10% 30%,#122a63 0,transparent 70%),var(--bg) fixed;color:var(--ink);font:15px/1.5 Barlow,system-ui,sans-serif}
h1,h2,h3,.num{font-family:"Barlow Condensed",Impact,sans-serif;letter-spacing:.01em}
header{background:linear-gradient(120deg,#0b1736,#16306c 65%,#1f56b8);color:#fff;padding:18px 20px 0;border-bottom:3px solid var(--flag);box-shadow:0 8px 30px #2de2e622}
.wrap{max-width:1400px;margin:0 auto}
.top{display:flex;gap:16px;align-items:end;flex-wrap:wrap;justify-content:space-between}
h1{margin:0;font-size:34px;font-weight:800;line-height:1}
.sub{color:#b4c0d6;font-size:13px;margin-top:4px}
form{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:14px}
input,select,button{font:inherit;padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
button{cursor:pointer;background:var(--flag);color:#14213d;border-color:var(--flag);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,.tab:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
nav{display:flex;gap:2px;overflow-x:auto}
.tab{background:none;border:0;color:#b4c0d6;padding:10px 14px;border-radius:6px 6px 0 0;font-weight:600}
.tab[aria-selected=true]{background:var(--bg);color:var(--ink)}
main{padding:0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;padding:20px;align-items:start}
#feed{position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column;background:linear-gradient(180deg,#152651,#0f1c3d);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 24px #02081a66;overflow:hidden}
.fh{padding:14px 16px 10px;border-bottom:1px solid var(--line)}.fh h2{margin:0;font-size:22px;display:flex;align-items:center;gap:8px}
.fh p{margin:2px 0 0;font-size:12px;color:var(--mute)}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--flag);box-shadow:0 0 0 0 #2de2e699;animation:pl 1.8s infinite}.pulse.off{background:#52679a;animation:none}
@keyframes pl{70%{box-shadow:0 0 0 8px #2de2e600}100%{box-shadow:0 0 0 0 #2de2e600}}
@keyframes fl{from{background:#2de2e638}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.pulse,.fresh{animation:none!important}}
#fl{overflow:auto;padding:4px 8px 8px}
.ev{display:flex;gap:11px;padding:10px 8px;border-bottom:1px solid var(--line);border-radius:8px}.ev:last-child{border:0}.fresh{animation:fl 3s ease-out}
.cp{display:inline-flex;align-items:center;gap:6px;background:#1d3470;border-radius:999px;padding:2px 10px 2px 2px;margin:5px 6px 0 0;font-size:12.5px}.cp img{width:24px;height:24px;border-radius:50%;object-fit:cover;background:#21418a}.cp small{color:var(--mute)}
.ph{width:42px;height:42px;border-radius:50%;background:#21418a;object-fit:cover;flex:none;display:grid;place-items:center;font:700 16px "Barlow Condensed";color:#cfe6ff}
.eb{min-width:0;flex:1}.et{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.et b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d{font:700 22px "Barlow Condensed";flex:none}.es{font-size:12.5px;color:var(--mute);line-height:1.4}.es b{color:var(--ink);font-weight:600}

.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.leagues .lg{text-align:left;background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:14px}
.lg b{display:block;font:700 20px "Barlow Condensed"}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--mute);font-size:13px}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
td.team{font-weight:600}
.rank{font:800 24px "Barlow Condensed";width:44px}
.bar{height:8px;border-radius:4px;background:var(--line);min-width:90px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--ink)}
.pos{color:var(--good);font-weight:600}.neg{color:var(--bad);font-weight:600}
.stat h3{margin:0;font-size:15px;color:var(--mute);font-weight:600}
.stat .num{font-size:30px;font-weight:700;line-height:1.1;margin:4px 0}
.stat p{margin:0;color:var(--mute);font-size:13px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.vs .r{text-align:right}.vs .num{font-size:26px;font-weight:700}
.prob{height:10px;display:flex;border-radius:5px;overflow:hidden;margin-top:8px;background:var(--line)}
.prob i{background:var(--ink)}.prob i+i{background:var(--flag)}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--line);margin-left:6px}
.chip.hot{background:var(--flag);color:#14213d}
.msg{padding:30px;text-align:center;color:var(--mute)}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.pill{font:700 12px Barlow;background:var(--ink);color:var(--bg);border-radius:4px;padding:1px 6px;margin-right:8px}
a.tab{text-decoration:none;white-space:nowrap}a.tab:hover{color:var(--flag)}section{margin-bottom:32px;scroll-margin-top:12px}.sh{font-size:30px;margin:0 0 12px}.brand{display:flex;gap:16px;align-items:center}.logo{border-radius:20px;box-shadow:0 0 0 2px #ffffff22,0 0 30px #2de2e655}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.sub{color:#a9c4f2!important;font-size:17px!important;font-weight:500;margin:0!important}
.card{background:linear-gradient(180deg,#152651,#0f1c3d)!important;border-radius:12px!important;box-shadow:inset 0 1px 0 #ffffff10,0 10px 24px #02081a66}
.sh{border-left:4px solid var(--flag);padding-left:12px}
.rank{color:var(--sky)}.stat .num{color:#8fd0ff}
.bar{background:#1a2c58}.bar i{background:linear-gradient(90deg,#3b6cf0,#2de2e6)!important}
.prob{background:#1a2c58}.prob i{background:#3b7bff!important}.prob i+i{background:var(--flag)!important}
.pill{background:#21418a!important;color:#cfe6ff!important}.chip{background:#1d3470;color:#cfe6ff}.chip.hot{background:var(--flag);color:#06122b}
button{color:#06122b!important}.tab{color:#a9c4f2!important}
select{background:#12214a;border-color:#2c4482}
th{color:#7f98c6}tr:hover td{background:#ffffff06}
.top{align-items:center!important;padding-bottom:16px}.years{display:flex;gap:6px;flex-wrap:wrap}.years button{background:#12214a;color:#a9c4f2!important;border:1px solid #2c4482;border-radius:999px;padding:6px 16px;font-weight:600;transition:background .15s}.years button:hover{background:#1b3370}.years button[aria-pressed=true]{background:var(--flag);color:#06122b!important;border-color:var(--flag)}.dr{display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);min-width:520px}
.dt{position:relative;height:22px;margin:0 58px}.dt .ax{position:absolute;top:0;font-size:12px;color:var(--mute);transform:translateX(-50%)}
.dot{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px #0f1c3d}.dot.w{background:var(--flag)}.dot.l{background:#3b7bff}
.seg{position:absolute;top:50%;height:6px;margin-top:-3px;background:#52679a;border-radius:3px}
.lbl{position:absolute;top:50%;font-size:12px;color:var(--ink);white-space:nowrap}
.lg2{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 8px;font-size:13px;color:var(--mute)}.lg2 i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.who{display:inline-flex;align-items:center;gap:9px;vertical-align:middle;min-width:0;text-align:left}
.av{width:32px;height:32px;border-radius:50%;object-fit:cover;flex:none;background:#21418a;display:inline-grid;place-items:center;font:700 15px "Barlow Condensed";color:#cfe6ff;box-shadow:0 0 0 1.5px #ffffff26}
.wt{display:flex;flex-direction:column;line-height:1.2;min-width:0}.wt b{font-weight:600}.wt small{color:var(--mute);font-size:12px;font-weight:400}
.who.sm{gap:5px}.who.sm .av{width:18px;height:18px;font-size:10px}.who.sm .wt{flex-direction:row;gap:5px;align-items:baseline;flex-wrap:wrap}
.vs .r .who{flex-direction:row-reverse}.vs .r .wt{text-align:right;align-items:flex-end}
.stat .sv{margin:8px 0 4px}.kick{font:700 12px Barlow;letter-spacing:.14em;text-transform:uppercase;color:var(--flag);margin-bottom:2px}
.snap{grid-template-columns:repeat(4,1fr)!important;margin-bottom:28px}
@media (max-width:1000px){
 .layout{grid-template-columns:1fr;padding:12px;gap:16px}
 #feed{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));top:auto;max-height:68vh;max-height:68dvh;z-index:50;box-shadow:0 -6px 30px #000a}
 #feed:not(.open) #fl,#feed:not(.open) #ff{display:none}
 .fh{cursor:pointer}.fh h2::after{content:"▴";margin-left:auto;color:var(--mute)}#feed.open .fh h2::after{content:"▾"}
 body{padding-bottom:92px}
 .snap{grid-template-columns:repeat(2,1fr)!important}
 header{padding:14px 12px 0}.logo{width:60px;height:60px}.sub{font-size:14px!important}
 .top{gap:10px}.years{width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}.years button{flex:none;min-height:40px}
 .tab{padding:12px 12px!important}select{font-size:16px}
 th,td{padding:8px}.sh{font-size:26px}.card{padding:12px}.rank{font-size:20px;width:34px}
 .ev{padding:10px 4px}
}
@media (max-width:520px){.snap{grid-template-columns:1fr!important}.av{width:28px;height:28px}}
.note{color:var(--mute);font-size:13px;margin:0 0 12px}
</style>

<script>
const API="https://api.sleeper.app/v1",$=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const get=async p=>{const r=await fetch(API+p);if(!r.ok)throw new Error("Sleeper returned "+r.status);return r.json()};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const sd=a=>{const m=avg(a);return Math.sqrt(avg(a.map(x=>(x-m)**2)))};
const f1=n=>n.toFixed(1);
const cdf=z=>{const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2),p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p};
let S={},PL=null;
const busy=t=>app.innerHTML=`<div class="msg">${t}</div>`;
async function players(){return PL||(PL=await get("/players/nfl"))}
const pn=id=>{const p=PL&&PL[id];return p?`${p.first_name?p.first_name[0]+". ":""}${p.last_name||p.full_name||id}`:"DEF "+id};
const pp=id=>PL&&PL[id]?(PL[id].position||"?"):"?";

async function loadLeague(l){busy("Crunching "+esc(l.name)+"…");
 try{S.season=l.season||S.season;const[st,users,rosters]=await Promise.all([get("/state/nfl"),get(`/league/${l.league_id}/users`),get(`/league/${l.league_id}/rosters`)]);
  const last=Math.min(18,(l.settings.playoff_week_start||15)-1);
  const wk=await Promise.all(Array.from({length:last},(_,i)=>get(`/league/${l.league_id}/matchups/${i+1}`).catch(()=>[])));
  const live=String(l.season)==st.season&&st.season_type=="regular",done=w=>!live||w<st.week;
  const pw={};wk.forEach((m,i)=>done(i+1)&&m.forEach(x=>{const q=x.players_points||{};for(const id in q)if(q[id]!==0)(pw[id]??=[]).push([i+1,q[id]])}));
  const um={};users.forEach(u=>um[u.user_id]=u);
  const T=rosters.map(r=>{const u=um[r.owner_id]||{};return{id:r.roster_id,roster:r,name:(u.metadata&&u.metadata.team_name)||u.display_name||"Team "+r.roster_id,owner:u.display_name||"",mgr:u.display_name||"",av:(u.metadata&&u.metadata.avatar)||(u.avatar?"https://sleepercdn.com/avatars/thumbs/"+u.avatar:""),
   w:r.settings.wins,l:r.settings.losses,t:r.settings.ties,pf:r.settings.fpts+(r.settings.fpts_decimal||0)/100,pa:(r.settings.fpts_against||0)+(r.settings.fpts_against_decimal||0)/100,sc:[],mine:!!S.user&&r.owner_id===S.user.user_id}});
  const by=Object.fromEntries(T.map(t=>[t.id,t]));
  const played=[];wk.forEach((m,i)=>{if(m.some(x=>x.points>0)&&done(i+1)){played.push(i+1);m.forEach(x=>{if(by[x.roster_id])by[x.roster_id].sc.push({wk:i+1,p:x.points,mid:x.matchup_id})})}});
  // all-play, luck, consistency
  T.forEach(t=>{let aw=0,g=0;t.sc.forEach(s=>{T.forEach(o=>{if(o===t)return;const os=o.sc.find(z=>z.wk===s.wk);if(os){g++;if(s.p>os.p)aw+=1;else if(s.p===os.p)aw+=.5}})});
   t.ap=g?aw/g:0;const gp=t.w+t.l+t.t;t.xw=t.ap*gp;t.luck=t.w+t.t/2-t.xw;t.gp=gp;t.avg=avg(t.sc.map(s=>s.p));t.sd=sd(t.sc.map(s=>s.p));t.form=avg(t.sc.slice(-3).map(s=>s.p))});
  const mx=k=>Math.max(...T.map(t=>t[k])),mn=k=>Math.min(...T.map(t=>t[k])),nz=(v,k)=>mx(k)===mn(k)?.5:(v-mn(k))/(mx(k)-mn(k));
  S.L=l;S.T=T;S.by=by;S.wk=wk;S.played=played;S.cur=Math.min(st.week,wk.length)||1;S.state=st;S.pw=pw;S.dstate="loading";S.pmode=undefined;renderPage();
 }catch(err){busy("Couldn’t load that league: "+esc(err.message))}}

const LV={events:[],prev:{},lead:{},seen:new Set(),ready:false,week:null,updated:0,timer:null,tick:null,espn:null,games:new Set(),pseen:new Set(),liveIds:new Set(),filter:"game",err:0,eok:0};
const SIGN=d=>(d>0?"+":"−")+Math.abs(d).toFixed(1);
const ago=t=>{const s=Math.max(0,(Date.now()-t)/1000);return s<10?"just now":s<60?Math.floor(s)+"s ago":s<3600?Math.floor(s/60)+"m ago":s<86400?Math.floor(s/3600)+"h ago":Math.floor(s/86400)+"d ago"};
function photo(id){const def=isNaN(id),u=def?`https://sleepercdn.com/images/team_logos/nfl/${String(id).toLowerCase()}.png`:`https://sleepercdn.com/content/nfl/players/thumb/${id}.jpg`;return`<img class="ph" src="${u}" alt="" loading="lazy" onerror="this.style.opacity=0">`}
const pinfo=id=>{const p=PL&&PL[id];return p?`${esc(p.position||"")} · ${esc(p.team||"FA")}`:""};
const tname=id=>{const t=S.by[id];return t?`<span class="who sm">${av(t)}<span class="wt"><b>${esc(t.name)}</b>${t.mgr&&t.mgr!==t.name?`<small>(${esc(t.mgr)})</small>`:""}</span></span>`:"Team"};
function stopLive(){clearInterval(LV.timer);clearInterval(LV.tick);clearInterval(LV.espn)}
function startLive(){stopLive();Object.assign(LV,{events:[],prev:{},lead:{},seen:new Set(),ready:false,week:null,updated:0,games:new Set(),pseen:new Set(),liveIds:new Set(),err:0,eok:0});
 const st=S.state;S.live=String(S.L.season)==st.season&&st.season_type=="regular";drawFeed();
 if(!S.live)return;poll();LV.timer=setInterval(poll,20000);LV.tick=setInterval(drawFeed,5000)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.live)poll()});
function push(e){LV.events.unshift(e);LV.events.sort((a,b)=>(b.t-a.t)||((b.seq||0)-(a.seq||0)));LV.events.length=Math.min(LV.events.length,80)}
async function poll(){if(document.hidden||!S.live)return;const L=S.L;
 try{const st=await get("/state/nfl");S.state=st;const w=st.week;

 const row=t=>{const w=t.poW??t.poL,l=t.poL??t.poW,lo=Math.min(w,l)*100,hi=Math.max(w,l)*100;
  return`<div class="dr"><div><b class="num" style="font-size:20px">${rec(t)}</b> ${nm(t)}</div><div class="dt"><span class="seg" style="left:${lo}%;width:${hi-lo}%"></span><i class="dot l" style="left:${l*100}%"></i><i class="dot w" style="left:${w*100}%"></i><span class="lbl" style="left:${lo}%;transform:translate(calc(-100% - 12px),-50%)">${(lo).toFixed(1)}%</span><span class="lbl" style="left:${hi}%;transform:translate(12px,-50%)">${hi.toFixed(1)}%</span></div></div>`};
 el.innerHTML=`<div class="card scroll"><p class="note">${o.N.toLocaleString()} simulated seasons, ${o.weeks} week${o.weeks>1?"s":""} left. Top ${o.P} of ${T.length} teams make the playoffs.</p><table><tr><th>#</th><th>Team</th><th>Record</th><th>Playoff odds</th><th>Proj. wins</th><th>If win wk ${o.w1}</th><th>If lose wk ${o.w1}</th></tr>${A.map((t,i)=>`<tr><td class="rank num">${i+1}</td><td class="team">${nm(t)}</td><td>${rec(t)}</td><td><div class="bar" style="display:inline-block;width:80px;vertical-align:middle;margin-right:8px"><i style="width:${t.po*100}%"></i></div>${pc(t.po)}</td><td>${t.pfw.toFixed(1)}</td><td class="pos">${pc(t.poW)}</td><td class="neg">${pc(t.poL)}</td></tr>`).join("")}</table></div>
 <div class="card scroll"><h3 style="margin:0 0 2px;font-size:24px">Impact of week ${o.w1} on playoff chances</h3><p class="note">Record through ${S.played.length} weeks</p><div class="lg2"><span><i style="background:var(--flag)"></i>With week ${o.w1} win</span><span><i style="background:#3b7bff"></i>With week ${o.w1} loss</span></div>${B.map(row).join("")}<div class="dr"><div></div><div class="dt">${[0,25,50,75,100].map(v=>`<span class="ax" style="left:${v}%">${v}</span>`).join("")}</div></div><p class="note" style="margin:14px 0 0">Playoff probability (%). Each team’s score is simulated around a blend of recent form and current lineup strength, with seeding by wins, then points. Division winners and other tiebreakers aren’t modeled, so treat close calls as estimates.</p></div>`}

function tiers(R,key){const k=R.length>=8?3:2,g=R.slice(1).map((t,i)=>[R[i][key]-t[key],i]).sort((a,b)=>b[0]-a[0]).slice(0,k).map(x=>x[1]);let tr=1;return R.map((t,i)=>{const x=tr;if(g.includes(i))tr++;return x})}
const mv=d=>d>0?`<span class="pos">▲${d}</span>`:d<0?`<span class="neg">▼${-d}</span>`:"–";
function drawPower(){const el=$("#pw");if(!el)return;el.innerHTML=power();el.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{S.pmode=b.dataset.m;drawPower()})}
function power(){const hasR=S.played.length>0,hasD=S.dstate=="done";let mode=S.pmode||(hasR?"now":"draft");if(!hasR)mode="draft";
 if(hasR)computePower();
 const tog=hasR?`<div class="years" style="margin-bottom:14px" role="group" aria-label="Ranking basis"><button type="button" data-m="now" aria-pressed="${mode=="now"}">Current</button><button type="button" data-m="draft" aria-pressed="${mode=="draft"}">At the draft</button></div>`:"";
 if(mode=="draft"){if(!hasD)return tog+`<div class="msg">${S.dstate=="loading"?"Loading draft results…":"No completed draft found for this league."}</div>`;
  const R=[...S.T].sort((a,b)=>a.drank-b.drank),mx=R[0].dscore||1;
  return tog+`<div class="card scroll"><p class="note">Draft-day strength: your best possible starting lineup using each pick’s draft value (earlier picks and bigger auction bids count for more), plus a small credit for bench depth. It ignores everything that happened after the draft.</p><table><tr><th>#</th><th>Team</th><th>Draft strength</th><th>Top pick</th>${hasR?"<th>Now</th>":""}</tr>${R.map(t=>`<tr><td class="rank num">${t.drank}</td><td class="team">${nm(t)}</td><td><div class="bar"><i style="width:${100*t.dscore/mx}%"></i></div></td><td>${t.best?esc(t.best.name)+" <small>("+t.best.pos+", pick "+t.best.pick+")</small>":"–"}</td>${hasR?`<td>#${t.nrank} ${mv(t.drank-t.nrank)}</td>`:""}</tr>`).join("")}</table></div>`}
 const R=[...S.T].sort((a,b)=>b.power-a.power),tr=tiers(R,"power");
 return tog+`<div class="card scroll"><table><tr><th>#</th><th>Team</th><th>Record</th><th>Recent form</th><th>Lineup pts</th><th>Power</th>${hasD?"<th>Since draft</th>":""}</tr>${R.map((t,i)=>`<tr><td class="rank num">${i+1}</td><td class="team">${nm(t)}<span class="chip">Tier ${tr[i]}</span></td><td>${t.w}-${t.l}${t.t?"-"+t.t:""}</td><td>${f1(t.rs)}</td><td>${PL?f1(t.rost):"…"}</td><td><div class="bar"><i style="width:${t.power}%"></i></div></td>${hasD?`<td>${mv(t.drank-t.nrank)}</td>`:""}</tr>`).join("")}</table>
 <details style="margin-top:12px"><summary>How these rankings work</summary><p class="note" style="margin-top:8px">Each part is scaled 0–100 against the rest of the league, then blended. <b>Recent form (25%)</b>: scoring average where each older week counts 15% less. <b>All-play (15%)</b>: record against every team every week, which removes schedule luck. <b>Colley rating (20%)</b>: a win/loss rating that credits beating strong opponents. <b>Lineup strength (40%)</b>: the best starting lineup each roster can field today, using every player’s recent points in your league’s scoring, with players who are out or on IR discounted or removed. Roster moves and injuries move this part as soon as they happen. While the player database loads, the other three parts are used on their own. Tiers split the list at the biggest gaps in score.</p></details></div>`}

function insights(){if(S.played.length<2)return'<div class="msg">Insights need at least two played weeks.</div>';
 const T=S.T,all=T.flatMap(t=>t.sc.map(s=>({t,...s})));
 const hi=all.reduce((a,b)=>b.p>a.p?b:a),lo=all.reduce((a,b)=>b.p<a.p?b:a);
 let close=null;S.wk.forEach((m,i)=>{if(!S.played.includes(i+1))return;const g={};m.forEach(x=>(g[x.matchup_id]??=[]).push(x));Object.values(g).forEach(p=>{if(p.length==2&&p[0].points+p[1].points>0){const d=Math.abs(p[0].points-p[1].points);if(!close||d<close.d)close={d,w:i+1,a:S.by[p[0].roster_id],b:S.by[p[1].roster_id],pa:p[0].points,pb:p[1].points}}})});
 const by=(k,dir=1)=>[...T].sort((a,b)=>dir*(b[k]-a[k]))[0];
 const c=(h,big,sub,s)=>`<div class="card stat"><h3>${h}</h3>${big}<p>${sub} ${s||""}</p></div>`,tm=t=>`<div class="sv">${nm(t)}</div>`,pts=v=>`<div class="num">${v}</div>`;
 const lk=by("luck"),ul=by("luck",-1),co=by("sd",-1),bb=by("sd");
 const ordered=[...T].sort((a,b)=>b.luck-a.luck),m=Math.max(...T.map(t=>Math.abs(t.luck)),1);
 return`<div class="grid">
 ${c("Luckiest team",tm(lk),`${lk.luck>0?"+":""}${lk.luck.toFixed(1)} wins`,"above what their scoring earned")}
 ${c("Unluckiest team",tm(ul),`${ul.luck.toFixed(1)} wins`,"below what their scoring earned")}
 ${c("Most consistent",tm(co),"±"+f1(co.sd),"weekly swing")}
 ${c("Boom or bust",tm(bb),"±"+f1(bb.sd),"weekly swing")}
 ${c("Highest week",pts(f1(hi.p)+" pts")+tm(hi.t),"","in week "+hi.wk)}
 ${c("Lowest week",pts(f1(lo.p)+" pts")+tm(lo.t),"","in week "+lo.wk)}
 ${close?c("Closest game",pts(f1(close.d)+" pts")+tm(close.a)+`<div class="sv"><small style="color:var(--mute)">vs</small> ${nm(close.b)}</div>`,"","in week "+close.w):""}</div>
 <div class="card"><h2 style="margin-top:0">Luck index</h2><p class="note">Actual wins minus expected wins from all-play. Green means the schedule helped, red means it hurt.</p>
 ${ordered.map(t=>`<div class="row"><span>${nm(t)}</span><span class="${t.luck>=0?"pos":"neg"}">${t.luck>0?"+":""}${t.luck.toFixed(1)} <small>(${t.w+t.t/2} actual, ${t.xw.toFixed(1)} expected)</small></span></div>`).join("")}</div>`}

function standings(){const r=[...S.T].sort((a,b)=>(b.w+b.t/2)-(a.w+a.t/2)||b.pf-a.pf);
 return`<div class="card scroll"><table><tr><th>#</th><th>Team</th><th>W-L</th><th>PF</th><th>PA</th><th>Diff</th><th>Exp. wins</th><th>Luck</th></tr>${r.map((t,i)=>`<tr><td class="rank num">${i+1}</td><td class="team">${nm(t)}</td><td>${t.w}-${t.l}${t.t?"-"+t.t:""}</td><td>${f1(t.pf)}</td><td>${f1(t.pa)}</td><td class="${t.pf>=t.pa?"pos":"neg"}">${t.pf>=t.pa?"+":""}${f1(t.pf-t.pa)}</td><td>${t.xw.toFixed(1)}</td><td class="${t.luck>=0?"pos":"neg"}">${t.luck>0?"+":""}${t.luck.toFixed(1)}</td></tr>`).join("")}</table></div>`}

function matchups(){const w=S.cur,m=S.wk[w-1]||[],g={};m.forEach(x=>(g[x.matchup_id]??=[]).push(x));
 const sel=`<select id="wsel" aria-label="Week" style="margin-bottom:12px">${S.wk.map((_,i)=>`<option value="${i+1}" ${i+1==w?"selected":""}>Week ${i+1}</option>`).join("")}</select>`;
 const live=!S.played.includes(w);
 return sel+(live?'<p class="note">This week hasn’t finished, so win chances come from each team’s scoring average and consistency.</p>':"")+`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr))">${Object.values(g).filter(p=>p.length==2).map(([a,b])=>{
  const A=S.by[a.roster_id],B=S.by[b.roster_id];let pa=cdf((A.avg-B.avg)/(Math.sqrt(A.sd**2+B.sd**2)||1));if(!live)pa=a.points>b.points?1:a.points<b.points?0:.5;
  return`<div class="card"><div class="vs"><div><b>${nm(A)}</b><div class="num">${f1(a.points)}</div></div><span>vs</span><div class="r"><b>${nm(B)}</b><div class="num">${f1(b.points)}</div></div></div>${live?`<div class="prob"><i style="width:${pa*100}%"></i><i style="width:${100-pa*100}%"></i></div><div class="vs" style="margin-top:4px;font-size:13px"><span>${(pa*100).toFixed(0)}%</span><span></span><span class="r">${(100-pa*100).toFixed(0)}%</span></div>`:""}</div>`}).join("")||'<div class="msg">No matchups for this week.</div>'}</div>`}

function rosters(){S.rsel??=(S.T.find(t=>t.mine)||S.T[0]).id;const t=S.by[S.rsel],r=t.roster,st=new Set(r.starters||[]);
 const sel=`<select id="rsel" aria-label="Team" style="margin-bottom:12px">${S.T.map(x=>`<option value="${x.id}" ${x.id==S.rsel?"selected":""}>${esc(x.name)}${x.mgr&&x.mgr!==x.name?" ("+esc(x.mgr)+")":""}</option>`).join("")}</select>`;
 const order=["QB","RB","WR","TE","K","DEF"],list=(r.players||[]).map(id=>({id,pos:pp(id)})).sort((a,b)=>order.indexOf(a.pos)-order.indexOf(b.pos));
 const row=p=>`<div class="row"><span><span class="pill">${p.pos}</span>${esc(pn(p.id))}<small style="color:var(--mute)"> ${esc((PL[p.id]||{}).team||"FA")}</small></span><span>${st.has(p.id)?"Starter":"Bench"}${PL[p.id]&&PL[p.id].injury_status?`<span class="chip hot">${esc(PL[p.id].injury_status)}</span>`:""}</span></div>`;
 return sel+`<div class="card"><div style="margin:2px 0 10px">${nm(t)}</div>${list.map(row).join("")}</div>`}

</script>
</body>
